name: Release

# Changesets, split so only publishing holds `id-token: write` and waits for the
# protected `release` environment. See docs/PUBLISHING.md.

on:
  push:
    branches: [trunk]

permissions: {}

jobs:
  verify-lockfile:
    name: Verify actions.lock
    if: github.repository == 'thomasfosterau/components' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.4.1
      - run: gh actions-lock --verify

  select:
    name: Select mode
    if: github.repository == 'thomasfosterau/components' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version-file: pnpm-workspace.yaml
          node-version: lts
          cache: true
          run-install: |
            - args: ['--frozen-lockfile', '--ignore-scripts']
      - name: Select mode
        id: mode
        uses: changesets/action/select-mode@v2.1.2

  version:
    name: Version packages
    needs: [verify-lockfile, select]
    if: needs.select.outputs.mode == 'version'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: release-version-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version-file: pnpm-workspace.yaml
          node-version: lts
          cache: false
          run-install: |
            - args: ['--frozen-lockfile', '--ignore-scripts']
      - name: Create or update the version PR
        id: version
        uses: changesets/action/version@v2.1.2
        with:
          script: pnpm changeset version
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'
      - name: Assign the owner to the version PR
        if: steps.version.outputs.pr-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.version.outputs.pr-number }}
        run: gh pr edit "$PR_NUMBER" --add-assignee thomasfosterau

  publish:
    name: Publish to npm
    needs: [verify-lockfile, select]
    if: needs.select.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: release-publish-${{ github.ref }}
      cancel-in-progress: false
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # No `registry-url`: its `.npmrc` token would be tried instead of OIDC.
      # pnpm (`vp pm publish`) does trusted publishing and provenance itself; no npm.
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version-file: pnpm-workspace.yaml
          node-version: lts
          cache: false
          run-install: |
            - args: ['--frozen-lockfile', '--ignore-scripts']
      # `vp run release` (vite.config.ts): builds every package on this commit,
      # publishes each unpublished version with `vp pm publish -r` (pnpm, which
      # exchanges the OIDC token itself), then `changeset git-tag` reports the
      # new tags through CHANGESETS_OUTPUT, and the action pushes them and
      # creates the releases.
      - name: Publish to npm
        uses: changesets/action/publish@v2.1.2
        with:
          script: vp run release
