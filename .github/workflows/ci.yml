name: CI

# ONE job, ONE required check. The pipeline is a short, ordered list of the
# same gates a human runs before pushing — there is no stage to deploy, no
# credential to inject and no service to provision, so nothing here needs a
# `needs:` graph.
#
# The one step that is CI-only is the Playwright browser install: `test:unit`
# drives real Chromium at exactly the revision the pinned `playwright`
# expects (see that entry in pnpm-workspace.yaml), which a fresh runner does
# not carry.

on:
  push:
    branches: [trunk]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Nothing by default; each job grants exactly what it uses.
permissions: {}

jobs:
  ci:
    name: Check, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm before Node so setup-node's `cache: pnpm` can resolve the store
      # path. The pnpm version comes from the `packageManager` field in
      # package.json — do not pin it here as well, or the two drift.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: latest
          cache: pnpm

      # `--ignore-scripts`: the root `prepare` only installs the Vite+ git
      # hooks, which a runner has no use for, and the two allowed builds
      # (`esbuild`, `@tailwindcss/oxide`) resolve their platform binaries
      # through optional dependencies, not their postinstall.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # `vp`, `svelte-check`, `svelte-package`, `storybook` and `playwright`
      # all land in node_modules/.bin, which is on nobody's PATH by default.
      - name: Put the toolchain on PATH
        run: echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"

      # Chromium + its apt system libraries, at exactly the revision the pinned
      # `playwright` expects, so a `playwright` bump needs nothing else here.
      - name: Install Chromium for the browser suite
        run: pnpm exec playwright install --with-deps chromium

      - name: Format and lint
        run: vp check

      - name: Type check
        run: vp run check

      - name: Unit tests (browser)
        run: vp run -r test:unit

      - name: Build the library
        run: vp run -r build

      - name: Build Storybook
        run: vp run --filter ./packages/components storybook:build
