name: CI

# One workflow, one command. The pipeline is the `ci` task in the root
# vite.config.ts: the gates of AGENTS.md § Verification, in order, so a local
# `vp run ci` and this workflow are the same thing. It runs once per Node line
# the published packages support (`lts` and `latest`, both inside
# package.json `engines.node`). The ruleset requires each leg by its check
# name: `ci (node lts)` and `ci (node latest)`.

on:
  pull_request:
  push:
    branches: [trunk]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/trunk' }}

# Nothing by default; each job grants exactly what it uses.
permissions: {}

jobs:
  ci:
    name: ci (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: [lts, latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Vite+ (`vp`), the matrix's Node.js line, pnpm, the pnpm store cache
      # (keyed on pnpm-lock.yaml) and `vp install`, which on CI is a
      # frozen-lockfile install. The vite-plus version is the catalog pin in
      # pnpm-workspace.yaml, so a toolchain bump needs nothing here.
      #
      # Install scripts RUN: the root `prepare` applies `effect-tsgo patch
      # --typescript --oxlint`, without which packages/charts' `check` runs an
      # unpatched `tsc` and `vp lint` cannot load the `effecttsgo` rules. The
      # allowed builds (pnpm-workspace.yaml `allowBuilds`) are the only other
      # scripts.
      - name: Setup Vite+ and install dependencies
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          version-file: pnpm-workspace.yaml
          node-version: ${{ matrix.node }}
          cache: true

      # The Vite+ task cache, per Node line. Keyed per commit with a prefix
      # fallback, so a push restores the nearest earlier run and each task's
      # own input fingerprint decides what re-runs.
      - name: Restore the Vite+ task cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: vp-task-v1-${{ runner.os }}-node-${{ matrix.node }}-${{ github.sha }}
          restore-keys: |
            vp-task-v1-${{ runner.os }}-node-${{ matrix.node }}-

      # `vp` is the global CLI setup-vp put on PATH. Nothing here adds
      # node_modules/.bin to `GITHUB_PATH`, so no installed file can shadow a
      # system binary (zizmor's `github-env`).
      - name: vp run ci
        run: vp run ci
