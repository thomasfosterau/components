# Some moves are by hand (npm aliases, the devcontainer image tag): see docs/CONTRIBUTING.md.
version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'daily'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'chore'
    cooldown:
      default-days: 1
      exclude:
        - '@thomasfosterau/*'
    groups:
      toolchain:
        applies-to: version-updates
        patterns:
          - 'vite-plus'
          - '@voidzero-dev/*'
          - 'vitest'
          - '@vitest/*'
          - '@effect/tsgo'
      effect:
        applies-to: version-updates
        patterns:
          - 'effect'
          - '@effect/*'
        exclude-patterns:
          - '@effect/tsgo'
      playwright:
        applies-to: version-updates
        patterns:
          - 'playwright'
          - 'playwright-core'
          - '@playwright/*'
      svelte:
        applies-to: version-updates
        patterns:
          - 'svelte'
          - '@sveltejs/*'
          - 'svelte-check'
      storybook:
        applies-to: version-updates
        patterns:
          - 'storybook'
          - '@storybook/*'
        exclude-patterns:
          - '@storybook/addon-svelte-csf'
      tailwind:
        applies-to: version-updates
        patterns:
          - 'tailwindcss'
          - '@tailwindcss/*'
    assignees:
      - thomasfosterau

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'daily'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'chore'
    cooldown:
      default-days: 1
    assignees:
      - thomasfosterau

  - package-ecosystem: 'devcontainers'
    directory: '/'
    schedule:
      interval: 'daily'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'chore'
    cooldown:
      default-days: 1
    assignees:
      - thomasfosterau
