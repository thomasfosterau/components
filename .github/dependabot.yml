# Some moves are by hand (npm aliases, the devcontainer image tag): see docs/CONTRIBUTING.md.
version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'daily'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'chore'
    cooldown:
      default-days: 1
      exclude:
        - '@thomasfosterau/*'
    groups:
      toolchain:
        applies-to: version-updates
        patterns:
          - 'vite-plus'
          - '@voidzero-dev/*'
          - 'vitest'
          - '@vitest/*'
          - '@effect/tsgo'
      effect:
        applies-to: version-updates
        patterns:
          - 'effect'
          - '@effect/*'
        exclude-patterns:
          - '@effect/tsgo'
      playwright:
        applies-to: version-updates
        patterns:
          - 'playwright'
          - 'playwright-core'
          - '@playwright/*'
      svelte:
        applies-to: version-updates
        patterns:
          - 'svelte'
          - '@sveltejs/*'
          - 'svelte-check'
      storybook:
        applies-to: version-updates
        patterns:
          - 'storybook'
          - '@storybook/*'
        exclude-patterns:
          - '@storybook/addon-svelte-csf'
      tailwind:
        applies-to: version-updates
        patterns:
          - 'tailwindcss'
          - '@tailwindcss/*'
          - 'daisyui'
      # Own packages release often and are 0.x (a minor can break): kept apart
      # so one doesn't hold up unrelated updates.
      thomasfosterau:
        applies-to: version-updates
        patterns:
          - '@thomasfosterau/*'
      ui:
        applies-to: version-updates
        patterns:
          - 'bits-ui'
          - '@lucide/svelte'
          - '@internationalized/date'
          - 'esm-env'
      charts:
        applies-to: version-updates
        patterns:
          - 'd3-*'
          - '@types/d3-*'
          - 'vega'
          - 'vega-lite'
          - 'prosemirror-*'
      lint:
        applies-to: version-updates
        patterns:
          - 'fallow'
          - '@enfect/oxlint'
      # Everything else, minor and patch only; majors still get their own PR.
      other:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
    assignees:
      - thomasfosterau

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'daily'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'chore'
    cooldown:
      default-days: 1
    groups:
      actions:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
    assignees:
      - thomasfosterau

  - package-ecosystem: 'devcontainers'
    directory: '/'
    schedule:
      interval: 'daily'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'chore'
    cooldown:
      default-days: 1
    assignees:
      - thomasfosterau
