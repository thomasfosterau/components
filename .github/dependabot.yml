# Dependabot version updates. The `npm` ecosystem at `/` reads the pnpm
# workspace and its catalogs (pnpm-workspace.yaml), so every bump is a catalog
# edit plus a regenerated lockfile.
#
# `groups` are only the sets whose members must move at the same time:
# released together from one monorepo with exact cross-pins, or tied by a
# hard compatibility table, so one bumped alone breaks the install or the
# build. Everything else (`fallow`, `bits-ui`, `@changesets/*`, the
# ProseMirror, vega and d3 packages, mapbox, …) updates in its own PR; there
# is no catch-all. Dependabot puts a dependency in the FIRST group that
# matches, so `exclude-patterns` keeps each package out of a group it would
# otherwise also match. Every group takes all update types, majors included.
#
# - `effect`: `effect` (also forced to one copy by `overrides`) and every
#   `@effect/*` package on its release train; `@effect/tsgo` is a toolchain
#   member.
# - `toolchain`: `vite-plus` and what it pins or is patched against. It pins
#   `vitest` and the `@vitest/*` packages EXACTLY (and so do
#   `@vitest/browser-playwright` and `@vitest/coverage-istanbul`, which peer
#   `vitest` at one version), and the `oxlint` / `oxfmt` / `oxlint-tsgolint` it
#   carries (transitive pins). `@effect/tsgo`'s patch (the root `prepare`)
#   hard-errors unless its release supports that exact oxlint / tsgolint and
#   the native TypeScript. `@enfect/oxlint` ranges its oxlint dependency, so
#   it is not in the set. A group PR is merged only once CI is green on it;
#   see the by-hand steps below.
# - `playwright`: `playwright` pins `playwright-core` exactly and decides the
#   Chromium revision CI installs (its catalog comment). `@vitest/browser*`
#   sit in `toolchain`, because they pin `vitest`.
# - `svelte`, `storybook`, `tailwind`: monorepo families
#   whose members pin or peer one another at one version (each group's
#   comment says how).
#
# `ignore` covers the npm ALIASES, which Dependabot cannot bump correctly;
# they move by hand, in the PR of the group they belong to (AGENTS.md
# § Common pitfalls):
# - `vite` = `npm:@voidzero-dev/vite-plus-core@<vite-plus version>`: set it to
#   the new `vite-plus` version in every `toolchain` PR that bumps vite-plus.
#   Also set `vitest` / `@vitest/*` to the versions the new vite-plus's
#   `dependencies` / `peerDependencies` name if the group took them past it.
# - `@typescript/native` = `npm:typescript@7.x` and `typescript` =
#   `npm:@typescript/typescript6@6.x`: move with `@effect/tsgo` to a version
#   its `components` table lists (node_modules/@effect/tsgo/dist/effect-tsgo.cjs).
# Each ignore is scoped to the `version-update:semver-*` types, so SECURITY
# updates stay enabled.
#
# `cooldown` follows pnpm-workspace.yaml's `minimumReleaseAge` (8 hours) and
# its `minimumReleaseAgeExclude`: first-party `@thomasfosterau/*` releases are
# not held. Dependabot counts whole days only, so it waits 1 day: longer than
# pnpm's 8 hours, so a Dependabot PR never proposes a version pnpm would still
# refuse to install. Cooldown applies per dependency, inside a group too.
version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'chore'
      prefix-development: 'chore'
    cooldown:
      default-days: 1
      exclude:
        - '@thomasfosterau/*'
    groups:
      # One release train: `effect` and `@effect/*` publish on one version.
      effect:
        applies-to: version-updates
        update-types: ['major', 'minor', 'patch']
        patterns:
          - 'effect'
          - '@effect/*'
        exclude-patterns:
          - '@effect/tsgo'
      # vite-plus pins vitest / @vitest/*; @effect/tsgo's patch supports only
      # the oxlint / tsgolint / TypeScript its components table lists.
      toolchain:
        applies-to: version-updates
        update-types: ['major', 'minor', 'patch']
        patterns:
          - 'vite-plus'
          - 'vitest'
          - '@vitest/*'
          - '@effect/tsgo'
      # `playwright` pins `playwright-core` exactly; `@playwright/test` pins both.
      playwright:
        applies-to: version-updates
        update-types: ['major', 'minor', 'patch']
        patterns:
          - 'playwright'
          - 'playwright-core'
          - '@playwright/*'
      # Svelte 5, SvelteKit, svelte-package, the vite plugin and svelte-check
      # peer one another's majors and move together.
      svelte:
        applies-to: version-updates
        update-types: ['major', 'minor', 'patch']
        patterns:
          - 'svelte'
          - '@sveltejs/*'
          - 'svelte-check'
      # One monorepo: `@storybook/sveltekit` pins its framework packages at
      # the `storybook` version. `@storybook/addon-svelte-csf` is versioned
      # separately.
      storybook:
        applies-to: version-updates
        update-types: ['major', 'minor', 'patch']
        patterns:
          - 'storybook'
          - '@storybook/*'
        exclude-patterns:
          - '@storybook/addon-svelte-csf'
      # `@tailwindcss/vite` pins `tailwindcss` exactly.
      tailwind:
        applies-to: version-updates
        update-types: ['major', 'minor', 'patch']
        patterns:
          - 'tailwindcss'
          - '@tailwindcss/*'
    ignore:
      - dependency-name: 'vite'
        update-types:
          [
            'version-update:semver-major',
            'version-update:semver-minor',
            'version-update:semver-patch',
          ]
      - dependency-name: 'typescript'
        update-types:
          [
            'version-update:semver-major',
            'version-update:semver-minor',
            'version-update:semver-patch',
          ]
      - dependency-name: '@typescript/native'
        update-types:
          [
            'version-update:semver-major',
            'version-update:semver-minor',
            'version-update:semver-patch',
          ]

  # Each action updates in its own PR (no group). `directories`, not `directory: '/'`: the
  # local composite action under .github/actions/setup pins actions too, and
  # `/` covers only .github/workflows (the Swift workflow included).
  - package-ecosystem: 'github-actions'
    directories:
      - '/'
      - '/.github/actions/setup'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'chore'
    cooldown:
      default-days: 1
  # The .devcontainer/ features (the image tag moves with vite-plus by hand).
  - package-ecosystem: 'devcontainers'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'chore'
    cooldown:
      default-days: 1
