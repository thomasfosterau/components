name: CI

# ONE job, ONE required check. The pipeline is the ordered list of gates in
# AGENTS.md § Verification; the task graph behind each lives in the
# vite.config.ts files, not in GitHub Actions `needs:`. There is no stage to
# deploy, no credential to inject and no service to provision.
#
# The one CI-only step is the Playwright browser install: `test:unit` and
# `storybook:build` drive real Chromium at exactly the revision the pinned
# `playwright` expects (see that entry in pnpm-workspace.yaml), which a fresh
# runner does not carry.

on:
  pull_request:
    branches: [trunk]
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [trunk]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/trunk' }}

# Nothing by default; the job grants exactly what it uses.
permissions: {}

jobs:
  ci:
    name: Check, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      # The Vite+ task cache (`vp run`'s cached `check`, `build`, `test:unit`
      # outputs). Keyed per commit with a prefix fallback, so a push restores
      # the nearest earlier run and each task's own input fingerprint decides
      # what re-runs.
      - name: Restore the Vite+ task cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: vp-task-v1-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            vp-task-v1-${{ runner.os }}-

      # Chromium + its apt system libraries, at exactly the revision the pinned
      # `playwright` expects, so a `playwright` bump needs nothing else here.
      - name: Install Chromium for the browser suites
        run: pnpm exec playwright install --with-deps chromium

      # The type-aware lint below reads the Svelte packages' tsconfigs, which
      # extend the `$app/tsconfig` that `svelte-kit sync` writes; without it
      # tsgolint reports `tsconfig-error` and types those packages as nothing.
      - name: Generate the SvelteKit types
        run: pnpm exec vp run -r sync

      # Format and lint; lint is type-aware through oxlint-tsgolint
      # (`lint.options.typeAware` in vite.config.ts).
      - name: Format and lint
        run: pnpm exec vp check

      - name: Type check
        run: pnpm exec vp run check

      - name: Unit tests
        run: pnpm exec vp run -r test:unit

      - name: Build the packages
        run: pnpm exec vp run -r build

      - name: Build Storybook
        run: pnpm exec vp run --filter ./packages/components storybook:build

      - name: Audit dependencies
        run: pnpm audit --audit-level high
