name: ChartSpecKit

# The Swift interpreter of the chart spec needs a macOS runner, so it runs only when it or the schema changes.

on:
  push:
    branches: [trunk]
    paths:
      - 'packages/charts/swift/**'
      - 'packages/charts/schema/**'
      - '.github/workflows/chartspeckit.yml'
  pull_request:
    paths:
      - 'packages/charts/swift/**'
      - 'packages/charts/schema/**'
      - '.github/workflows/chartspeckit.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  swift:
    name: Swift package (ChartSpecKit)
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: swift --version
      - name: Run tests
        working-directory: packages/charts/swift/ChartSpecKit
        run: swift test
