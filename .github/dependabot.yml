# Dependabot version updates — the same shape as effect-drizzle-ext's, with
# the groups this workspace needs.
#
# `groups` collect dependencies that MUST move together: Svelte and its kit /
# plugin / checker; the vite-plus toolchain; and Storybook, whose addons are
# versioned in lockstep with the core. A dependency joins only the FIRST group
# it matches, and no other group's patterns match a member of another.
#
# `vite-plus-toolchain` is `vite-plus` plus the packages it pins exactly:
# `vitest` and `@vitest/*` (here, `@vitest/browser-playwright`), so they never
# arrive in separate PRs (#47, #88; see the `vite-plus` entry in
# pnpm-workspace.yaml). Grouping only batches whatever each member's latest
# release is, so EVERY PR from this group needs two hand-pushed fixes before
# merge:
# - bump the `vite` alias to `npm:@voidzero-dev/vite-plus-core@<the new
#   vite-plus version>` (Dependabot cannot, see `ignore` below);
# - set `vitest` / `@vitest/browser-playwright` to the version the new
#   vite-plus's `dependencies` / `peerDependencies` name, not past it (a
#   vitest release vite-plus has not adopted yet, or one still in `cooldown`,
#   lands out of step).
# A group PR that does NOT bump `vite-plus` (vitest or `@vitest/*` released
# alone) has no vite-plus version to follow: close it unmerged. The same holds
# for a standalone vitest security update; groups apply only to version
# updates, so it arrives as its own PR and gets the same check.
# `vitest-browser-svelte` is deliberately outside the group: vite-plus does
# not pin it, so its bumps need no alias step.
#
# `ignore` covers the catalog entries Dependabot cannot bump correctly:
# - `vite` and `typescript` are npm aliases (`npm:@voidzero-dev/vite-plus-core`,
#   `npm:@typescript/typescript6`); the alias target moves with vite-plus and
#   the TypeScript 7.1 migration respectively, by hand. Ignoring `vite`
#   removes only `vite` from consideration; no group pattern matches it, so
#   the `vite-plus-toolchain` group still opens.
# `playwright` is NOT ignored: CI installs the Chromium revision each release
# expects, so its bumps are ordinary updates (see its catalog entry).
# Each ignore is scoped to the `version-update:semver-*` update types, so
# SECURITY updates stay enabled (a bare `dependency-name` ignore would block
# those too).
#
# `cooldown` mirrors pnpm-workspace.yaml's `minimumReleaseAge` (1 day), and
# its `minimumReleaseAgeExclude`: first-party `@thomasfosterau/*` releases are
# not held.
# Per the docs, cooldown is applied per dependency (inferred to hold inside a
# group too): a member whose release is still inside it is left out of that
# group PR, not the whole PR.
version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'chore'
      prefix-development: 'chore'
    cooldown:
      default-days: 1
      exclude:
        - '@thomasfosterau/*'
    groups:
      svelte:
        patterns:
          - 'svelte'
          - 'svelte-check'
          - '@sveltejs/*'
      vite-plus-toolchain:
        patterns:
          - 'vite-plus'
          - 'vitest'
          - '@vitest/*'
      storybook:
        patterns:
          - 'storybook'
          - '@storybook/*'
    ignore:
      - dependency-name: 'vite'
        update-types:
          [
            'version-update:semver-major',
            'version-update:semver-minor',
            'version-update:semver-patch',
          ]
      - dependency-name: 'typescript'
        update-types:
          [
            'version-update:semver-major',
            'version-update:semver-minor',
            'version-update:semver-patch',
          ]
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'ci'
      include: 'scope'
