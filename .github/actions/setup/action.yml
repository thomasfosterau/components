# Composite setup shared by every workflow job that needs the toolchain: pnpm,
# Node with the pnpm store cache (keyed on pnpm-lock.yaml by setup-node), a
# frozen-lockfile install (retried, see that step), and node_modules/.bin on
# PATH so later steps call `vp`, `fallow`, `playwright` directly. The shape is
# effect-web's action.
#
# Callers run `actions/checkout` BEFORE this: a local composite action needs
# the repository on disk first.
name: Setup toolchain
description: Set up pnpm and Node.js, restore the package cache, and install dependencies.
runs:
  using: composite
  steps:
    # pnpm before Node so setup-node's `cache: pnpm` can resolve the store
    # path. The pnpm version comes from `packageManager` in package.json; do
    # not pin it here as well, or the two drift.
    - name: Setup pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: latest
        cache: pnpm

    # Install scripts RUN: the root `prepare` applies `effect-tsgo patch
    # --typescript --oxlint`, without which packages/charts' `check` runs an
    # unpatched `tsc` (no Effect diagnostics) and `vp lint` cannot load the
    # `effecttsgo` rules the root vite.config.ts names. The allowed builds
    # (pnpm-workspace.yaml `allowBuilds`) are the only other scripts.
    #
    # Retried: pnpm's linker can race itself when a package with a build
    # script resolves twice and both copies build (a transient ENOENT on the
    # rename of a `_tmp_<pid>_<hex>` staging directory, seen in the owner's
    # other repos on cold-store runs). Every attempt keeps `--frozen-lockfile`,
    # so a deterministic failure (lockfile drift, a policy violation) still
    # fails all three.
    - name: Install dependencies
      shell: bash
      run: |
        for attempt in 1 2 3; do
          if pnpm install --frozen-lockfile; then
            break
          fi
          if [ "$attempt" -eq 3 ]; then
            echo "::error::pnpm install failed after 3 attempts"
            exit 1
          fi
          delay=$((attempt * 15))
          echo "::warning::pnpm install failed (attempt ${attempt}/3); retrying in ${delay}s"
          sleep "$delay"
        done
        echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
