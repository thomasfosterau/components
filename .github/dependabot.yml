# Dependabot version updates — the same shape as effect-drizzle-ext's, with
# the groups this workspace needs.
#
# `groups` collect dependencies that MUST move together: Svelte and its kit /
# plugin / checker; the vitest toolchain, which is pinned to vite-plus's exact
# versions (see the `vitest` entry in pnpm-workspace.yaml); and Storybook,
# whose addons are versioned in lockstep with the core.
#
# `ignore` covers the catalog entries Dependabot cannot bump correctly:
# - `vite` and `typescript` are npm aliases (`npm:@voidzero-dev/vite-plus-core`,
#   `npm:@typescript/typescript6`); the alias target moves with vite-plus and
#   the TypeScript 7.1 migration respectively, by hand.
# - `playwright` is pinned to the Chromium revision the agent-session image
#   pre-installs, and moves with that image, not with npm.
# Each ignore is scoped to the `version-update:semver-*` update types, so
# SECURITY updates stay enabled (a bare `dependency-name` ignore would block
# those too).
#
# `cooldown` mirrors pnpm-workspace.yaml's `minimumReleaseAge` (1 day), and
# its `minimumReleaseAgeExclude`: first-party `@thomasfosterau/*` releases are
# not held.
version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'chore'
      prefix-development: 'chore'
    cooldown:
      default-days: 1
      exclude:
        - '@thomasfosterau/*'
    groups:
      svelte:
        patterns:
          - 'svelte'
          - 'svelte-check'
          - '@sveltejs/*'
      vitest-toolchain:
        patterns:
          - 'vite-plus'
          - 'vitest'
          - '@vitest/*'
          - 'vitest-browser-svelte'
      storybook:
        patterns:
          - 'storybook'
          - '@storybook/*'
    ignore:
      - dependency-name: 'vite'
        update-types:
          [
            'version-update:semver-major',
            'version-update:semver-minor',
            'version-update:semver-patch',
          ]
      - dependency-name: 'typescript'
        update-types:
          [
            'version-update:semver-major',
            'version-update:semver-minor',
            'version-update:semver-patch',
          ]
      - dependency-name: 'playwright'
        update-types:
          [
            'version-update:semver-major',
            'version-update:semver-minor',
            'version-update:semver-patch',
          ]
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'ci'
      include: 'scope'
