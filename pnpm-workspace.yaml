# Every external version lives here; package.json files use only `catalog:`,
# `catalog:peers`, `catalog:published` or `workspace:*` (`workspace:^` for a
# companion package's peer on @thomasfosterau/components).
packages:
  - packages/*

catalogMode: strict

catalog:
  # A required peer of bits-ui, made a dependency of packages/components so consumers needn't know it.
  '@internationalized/date': ^3.8.1
  'mapbox-gl': ^3.35.2
  '@changesets/cli': ^3.0.3
  # Optional peer of `/entity-form`; a devDependency for its suite and story.
  '@thomasfosterau/effect-forms-svelte': ^0.4.2
  effect: 4.1.5
  # Peers `effect` at its own exact version: moves with `effect`.
  '@effect/vitest': 4.1.5
  '@thomasfosterau/effect-document': ^0.3.0
  # effect-document's optional peer for its readers; packages/import's suite reads CSV with it.
  '@thomasfosterau/effect-parse': ^0.6.2
  '@lucide/svelte': ^1.80.0
  # DEV/BROWSER conditions, resolved by the consumer's bundler; Svelte itself depends on it.
  esm-env: ^1.2.2
  '@types/d3-scale': ^4.0.9
  '@types/d3-shape': ^3.1.8
  d3-scale: ^4.0.3
  d3-shape: ^3.2.1
  happy-dom: ^21.0.4
  prosemirror-model: ^1.25.13
  prosemirror-view: ^1.44.0
  vega: ^6.2.0
  vega-lite: ^6.4.3
  '@storybook/addon-a11y': ^10.6.9
  '@storybook/addon-svelte-csf': ^5.1.6
  '@storybook/sveltekit': ^10.6.9
  # Build-time only: `svelte-kit sync` and `svelte-package`.
  '@sveltejs/kit': 3.4.0
  '@sveltejs/package': 3.0.3
  '@sveltejs/vite-plugin-svelte': ^7.3.2
  '@tailwindcss/vite': ^4.3.5
  '@testing-library/jest-dom': ^8.0.0
  '@types/node': ^26.6.10
  # Pins `vitest` exactly, so it follows the `vitest` entry below.
  '@vitest/browser-playwright': 5.1.1
  bits-ui: ^2.22.0
  daisyui: ^5.8.2
  # Exact: each release expects one Chromium revision. 1.56.1–1.59.x hang
  # extracting the browser on Node >= 26.1.0.
  playwright: 1.65.1
  storybook: ^10.6.9
  svelte-check: ^4.7.8
  svelte: ^5.59.1
  tailwindcss: ^4.3.5
  # TS6 under the `typescript` name, for svelte-check (which needs the JS API).
  typescript: 'npm:@typescript/typescript6@6.0.2'
  # vite-plus pins oxlint, oxfmt and vitest exactly: `vitest`, `@vitest/*` and
  # the `vite` alias follow what it depends on (the alias no longer shares the
  # vite-plus version).
  vite-plus: 1.8.0
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8001
  vitest: 5.1.1
  '@vitest/coverage-istanbul': 5.1.1
  # `effect-tsgo patch` (the root `prepare`) supports only the TypeScript,
  # oxlint and tsrs versions in its `components` table
  # (node_modules/@effect/tsgo/dist/effect-tsgo.cjs); check it before bumping
  # this, `@typescript/native` or `vite-plus`.
  '@effect/tsgo': 0.73.4
  # TS7, Effect-patched by `prepare`; type-checks packages/charts and packages/import.
  '@typescript/native': npm:typescript@7.0.2
  '@enfect/oxlint': 0.10.0
  fallow: 3.48.0
  vitest-browser-svelte: ^3.1.0

# Ranges promised to consumers, written into the packed manifests by `pnpm pack`.
# Raising one is a published change and needs a changeset. `svelte` is
# effect-forms-svelte's own floor; `effect` is `^4.0.0` unless a dependency
# requires more.
catalogs:
  peers:
    svelte: ^5.40.0
    '@thomasfosterau/effect-forms-svelte': ^0.4.2
    effect: ^4.0.0
    '@thomasfosterau/effect-document': ^0.3.0
    prosemirror-model: ^1.0.0
    prosemirror-view: ^1.0.0
  published:
    effect: ^4.0.0

# Singletons whose duplication would break at runtime, not in any gate.
overrides:
  svelte: 'catalog:'
  '@sveltejs/kit': 'catalog:'
  effect: 'catalog:'
  vite@*: 'catalog:'
  vitest@*: 'catalog:'

nodeLinker: hoisted

# `playwright` is absent on purpose: its browser is installed explicitly.
allowBuilds:
  '@tailwindcss/oxide': true
  esbuild: true
  fallow: true

# Agent skills dependencies ship (pnpm 12.11+). `fallow` ships `fallow` and
# `fallow-setup`; only `fallow` is linked, since the repository is already set
# up. Build grants stay in `allowBuilds`: a `permissions` entry without `build`
# leaves its package's `allowBuilds` grant in force.
permissions:
  fallow:
    skills: [fallow]

skills:
  dirs: [.claude/skills]

# storybook's `vite-plus` peer range (^0.1 || ^0.2) predates Vite+ 1.x.
peerDependencyRules:
  allowedVersions:
    vite-plus: '*'

# Minutes: hold new third-party releases for 24 hours.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@thomasfosterau/*'
# Vite+ selects Node.js (.node-version) and pnpm (packageManager); pnpm
# must not download or switch to its own.
runtimeOnFail: ignore
pmOnFail: ignore
