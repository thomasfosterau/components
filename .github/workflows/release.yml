name: Release

# Changesets release flow: on every push to `trunk`, changesets/action either
# opens/updates the "chore: version packages" pull request (while unreleased
# changesets exist) or, once that pull request has merged, publishes every
# package whose version is not yet on npm and tags the release.
#
# Publishing is npm Trusted Publishing (OIDC) — there is NO `NPM_TOKEN` secret
# and none is read here. The job's `id-token: write` lets the npm CLI exchange
# a GitHub-minted token for a short-lived publish credential, scoped to this
# repository, this workflow file and the `release` environment, which is what
# each package's trusted publisher on npmjs.com names. Nothing requests
# provenance (an explicit request fails from a private repository).
#
# The publish step is `scripts/publish.mjs` (`pnpm pack` + `npm publish
# <tarball>`), not `changeset publish`; its header says why it is kept.

on:
  push:
    branches: [trunk]

concurrency: ${{ github.workflow }}-${{ github.ref }}

# Nothing by default; the job grants exactly what it uses.
permissions: {}

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A protected environment (deployment branches: `trunk` only), named by the
    # trusted publisher on npmjs.com — a workflow run from any other ref cannot
    # mint a publish credential even if it copies this file.
    environment: release
    permissions:
      # Commit the version bump, push tags, create GitHub releases.
      contents: write
      # Open / update the "chore: version packages" pull request.
      pull-requests: write
      # npm Trusted Publishing (OIDC).
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # No `registry-url`: that writes an `.npmrc` whose `_authToken` reads
      # `NODE_AUTH_TOKEN`, and a configured token — even an empty placeholder
      # — is what npm tries instead of OIDC.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      # Trusted Publishing needs npm >= 11.5.1; Node 22 bundles npm 10. Pinned
      # to a major rather than `@latest`: this job holds `id-token: write`, so
      # a new npm major should arrive by a reviewed change (#44).
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11

      # `--ignore-scripts`: the root `prepare` only installs the Vite+ git
      # hooks, and nothing on the build path needs an install script.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Put the toolchain on PATH
        run: echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"

      # The publish path runs `vp run -r build` first (the root `release`
      # script) — `files` is `["dist"]`, so a stale or missing build would
      # publish an empty package rather than fail.
      #
      # `pnpm run`, not `vp run`, for the script itself: `vp run` does not
      # forward the ambient `ACTIONS_ID_TOKEN_REQUEST_URL` / `_TOKEN` that npm
      # needs for OIDC, and npm then falls back to token auth and fails with
      # ENEEDAUTH.
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm changeset version
          publish-script: pnpm run release
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'
        # No `env:` block on purpose: don't force provenance (NPM_CONFIG_PROVENANCE).
        # npm attaches it itself when allowed, and an explicit request fails
        # from a private repository.
