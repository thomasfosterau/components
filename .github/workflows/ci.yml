name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Check, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format, lint, and type check
        run: npx vp check

      - name: Type check the Svelte package
        run: npm run check -w @thomasfosterau/components

      - name: Test
        run: npx vp test run

      - name: Build all packages
        run: npm run build

      - name: Build the component library demo
        run: npm run build:demo -w @thomasfosterau/components

      - name: Verify the JSON Schema artifact is in sync
        run: |
          npm run emit-schema
          git diff --exit-code schema/ \
            || (echo '::error::schema/chart-spec.v1.json is out of date. Run `npm run emit-schema` and commit the result.' && exit 1)

      - name: Verify no Effect types leak into published type definitions
        run: |
          if grep -rln "effect" packages/chart-*/dist/*.d.mts; then
            echo '::error::Published .d.mts files must not reference effect (the Effect isolation invariant).'
            exit 1
          fi
          echo 'No effect references found in published type definitions.'
