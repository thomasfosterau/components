# pnpm workspace — two publishable packages (`packages/components`,
# `packages/maps`).
#
# The `catalog:` protocol pins versions that MUST be singletons across the
# workspace. `svelte` especially: two copies break the compiler's runtime
# identity (`$state` proxies, context keys, snippet types) in ways that only
# show up at render time.
#
# EVERY external dependency version lives here — package.json files reference
# only `catalog:` / `catalog:peers` (or `workspace:*` for internal packages).
# `catalogMode: strict` makes `pnpm add` enforce this at add time and
# `pnpm install` reject non-catalog specifiers.
# After editing this catalog, ALWAYS run `pnpm install` and commit the
# regenerated pnpm-lock.yaml — a stale lockfile fails every CI job at once
# with ERR_PNPM_LOCKFILE_CONFIG_MISMATCH.
#
# Versions are kept in lockstep with the owner's app repos (the Gardeneria /
# Website foundation catalog) wherever the two overlap, so a component
# authored here compiles identically in the app that consumes it. The three
# entries that deliberately differ are commented below.
packages:
  - packages/*

catalogMode: strict

catalog:
  # A REQUIRED peer of bits-ui (its date and calendar primitives import it),
  # declared as a runtime `dependency` of packages/components rather than left
  # to peer resolution, because a consumer should not have to know bits-ui's
  # peer list to use a Dialog.
  '@internationalized/date': ^3.8.1
  # The REQUIRED peer of `@thomasfosterau/components-maps` — and the reason
  # that package exists at all, adjacent to `packages/components` rather than
  # inside it: a component whose behaviour needs a specific third-party engine
  # lives in its own package, so the core library stays free of it. Installed
  # here as a devDependency of packages/maps too, so that package's own browser
  # suite and its stories load the real module. The range is what consumers
  # must satisfy.
  'mapbox-gl': ^3.32.0
  '@changesets/cli': ^3.0.3
  # The OPTIONAL peer of `@thomasfosterau/components/entity-form`, and a
  # devDependency so that entry's browser suite and story run the real store.
  # Only that entry imports it: a consumer that never renders an
  # `EntityForm` never installs it. `effect` is ITS required peer, pinned to
  # the app catalog's (preferenceflow's) exact release so the store here is
  # the one the apps run. Nothing else in this workspace touches Effect.
  '@thomasfosterau/effect-forms-svelte': ^0.2.0
  effect: 4.0.0
  # Lucide icon set as Svelte 5 components. Catalogued and installed ahead of
  # its first consumer: the real components land on top of this scaffold and
  # every one that needs an affordance icon reaches for this rather than
  # inlining an `<svg>`.
  '@lucide/svelte': ^1.52.0
  # Storybook 10 over the SvelteKit framework preset — the Svelte 5 + Vite
  # pipeline a `svelte-package` library uses too — plus the Svelte CSF addon
  # so snippet-taking components can be storied in `.svelte`, and the a11y
  # addon because accessibility is part of this library's contract rather
  # than a review afterthought.
  '@storybook/addon-a11y': ^10.6.0
  '@storybook/addon-svelte-csf': ^5.1.3
  '@storybook/sveltekit': ^10.6.0
  # SvelteKit is a BUILD-TIME dependency here, not a runtime one: `svelte-kit
  # sync` generates the package's ambient types and `svelte-package` emits
  # `dist/`. Nothing in `src/lib/` may import `$app/*` — see
  # packages/components/CLAUDE.md.
  '@sveltejs/kit': 3.0.0
  '@sveltejs/package': 3.0.0
  '@sveltejs/vite-plugin-svelte': ^7.3.1
  '@tailwindcss/vite': ^4.3.3
  '@testing-library/jest-dom': ^7.0.1
  '@types/node': ^26.6.4
  # Vitest browser mode: the Playwright provider is its own package as of
  # v4 and pins `vitest` EXACTLY, so it must track the `vitest` entry below,
  # which in turn tracks vite-plus's own pin (vite-plus also peers this
  # package at that exact version).
  # `@vitest/browser` itself arrives through vite-plus, so it is not
  # catalogued separately.
  '@vitest/browser-playwright': 5.0.3
  # Headless Svelte 5 primitives. Every component whose behaviour is more
  # than "render these attributes" — menus, dialogs, comboboxes, tooltips —
  # is built on a bits-ui primitive rather than on hand-rolled keyboard and
  # focus handling. A runtime `dependency`, not a peer: consumers should not
  # have to know the library exists.
  bits-ui: ^2.19.3
  daisyui: ^5.7.47
  # The ONLY consumer is the Vitest browser provider above (`playwright: "*"`
  # peer); this repo has no Playwright test suite of its own, which is why it
  # takes `playwright` rather than the app repos' `@playwright/test`.
  #
  # PINNED EXACT, because each release expects one exact Chromium revision
  # (1.63.0 -> 1243, `browsers.json` in playwright-core) and refuses any
  # other. It is NOT tied to a session image: CI installs its own browser
  # (`pnpm exec playwright install --with-deps chromium`) on every run, so a
  # bump is an ordinary catalog change. A session whose image pre-installs a
  # different revision under `PLAYWRIGHT_BROWSERS_PATH` runs `pnpm exec
  # playwright install chromium` once, or reports the browser gates as not
  # run (AGENTS.md § Verification).
  #
  # Floor 1.60.0: 1.56.1-1.59.x extract the browser zip with a yauzl stream
  # that marks itself destroyed before its buffered tail drains, and Node
  # >= 26.1.0 no longer resumes a destroyed stream (nodejs/node#62557), so
  # `playwright install` hangs forever on Node `latest` (#81).
  playwright: 1.63.0
  storybook: ^10.6.0
  svelte-check: ^4.7.6
  svelte: ^5.57.1
  tailwindcss: ^4.3.3
  # The TS6 JS compiler, aliased so the package stays importable as
  # `typescript`: svelte-check drives TypeScript through its JS API, which
  # TypeScript 7 (the native Go compiler) does not ship until 7.1. The app
  # repos pair this with `@typescript/native` for their pure-TS surfaces;
  # there is no pure-TS surface here worth a second compiler, so this is the
  # only one.
  typescript: 'npm:@typescript/typescript6@6.0.2'
  # vite-plus pins `oxlint`, `oxfmt`, `vitest` and the `@vitest/*` packages
  # to exact versions. `vitest` and `@vitest/browser-playwright` FOLLOW that
  # pin (vite-plus 1.1.0 -> 5.0.3) rather than running ahead of it (#47):
  # bump them in the same change as `vite-plus`, to the version its
  # `dependencies` name, and never on their own.
  # `vite` is the same release published under its aliased core package.
  vite-plus: 1.1.0
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vitest: 5.0.3
  # `render` + locators for Svelte components under Vitest browser mode. The
  # app repos use @testing-library/svelte under happy-dom instead; this repo
  # runs the real browser, and this is the renderer Vitest browser mode
  # documents for Svelte.
  vitest-browser-svelte: ^3.1.0

# Published peer ranges, kept apart from the default catalog because a peer
# range is a promise to consumers, not the version this workspace builds and
# tests against: `svelte` above is the dev pin (^5.57.1), `svelte` here is
# the floor both published manifests declare. `pnpm pack` (the release path,
# scripts/publish.mjs) rewrites `catalog:peers` to this literal range, so the
# packed package.json files carry `"svelte": "^5.30.1"`. Raising the floor is
# a published-behaviour change and takes a changeset.
catalogs:
  peers:
    svelte: ^5.30.1

overrides:
  # Singletons. See the `catalog:` note at the top: `svelte` and `vite` are
  # the two whose duplication is invisible to every gate and fatal at
  # runtime, and `vitest` is forced to the catalog singleton so vite-plus,
  # the browser provider (exact `vitest` peer) and the packages share one
  # copy. `effect` is a fourth whose duplication no gate notices: two copies
  # break `Context` / `Layer` / `Schema` identity at runtime. Only one
  # resolves today; this is insurance.
  svelte: 'catalog:'
  vite: 'catalog:'
  vitest: 'catalog:'
  '@sveltejs/kit': 'catalog:'
  effect: 'catalog:'

nodeLinker: hoisted

# Install scripts are opt-in. `playwright` is deliberately ABSENT: its
# postinstall downloads a browser bundle, which CI installs explicitly in its
# own step and a session installs on demand (AGENTS.md § Verification).
allowBuilds:
  '@tailwindcss/oxide': true
  esbuild: true

# Storybook 10.6 declares `vite-plus: "^0.1.15 || ^0.2.0"` and this workspace
# is on 1.1.0 — the toolchain is deliberately ahead of what the addon ecosystem
# has caught up to, and the same goes for `vite` / `vitest` / `@sveltejs/kit`,
# all of which are forced to one catalog singleton by the overrides above.
peerDependencyRules:
  allowAny:
    - vite
    - vite-plus
    - vitest
    - '@sveltejs/kit'
  allowedVersions:
    vite: '*'
    vite-plus: '*'
    vitest: '*'
    '@sveltejs/kit': '*'

# Supply-chain delay (owner's policy): hold newly published versions for 1 day
# before pnpm will install them, so a compromised release has a window to get
# pulled before it reaches this workspace. Unit is MINUTES, not seconds
# (`opts.minimumReleaseAge * 60 * 1e3` in pnpm's own source), so 1 day = 1440.
minimumReleaseAge: 1440
# First-party releases are exempt: `@thomasfosterau/*` is published by the
# owner (from this repo and its siblings), so holding it a day only delays
# adoption of a release the owner just cut, and protects against nothing.
minimumReleaseAgeExclude:
  - '@thomasfosterau/*'
